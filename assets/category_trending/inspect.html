<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Inspect Pure Crops</title>
  <style>
    body { background: #0b0d12; color: #fff; font-family: sans-serif; padding: 30px; }
    h2 { border-bottom: 1px solid #333; padding-bottom: 8px; color: #a3ff12; }
    .grid { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 30px; }
    .card { background: #161a23; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
    img { max-height: 200px; display: block; border-radius: 8px; }
    p { margin: 8px 0 0; font-size: 13px; color: #888; }
  </style>
</head>
<body>
  <h2>1. Pure Category Products</h2>
  <div class="grid">
    <div class="card"><img src="cat_prod_1_pure.png"><p>Cat Prod 1 Pure</p></div>
    <div class="card"><img src="cat_prod_2_pure.png"><p>Cat Prod 2 Pure</p></div>
    <div class="card"><img src="cat_prod_3_pure.png"><p>Cat Prod 3 Pure</p></div>
    <div class="card"><img src="cat_prod_4_pure.png"><p>Cat Prod 4 Pure</p></div>
  </div>

  <h2>2. Pure Trending Products (Pedestal + Vapes only)</h2>
  <div class="grid">
    <div class="card"><img src="trend_prod_1_pure.png"><p>Trend Prod 1 Pure</p></div>
    <div class="card"><img src="trend_prod_2_pure.png"><p>Trend Prod 2 Pure</p></div>
    <div class="card"><img src="trend_prod_3_pure.png"><p>Trend Prod 3 Pure</p></div>
    <div class="card"><img src="trend_prod_4_pure.png"><p>Trend Prod 4 Pure</p></div>
    <div class="card"><img src="trend_prod_5_pure.png"><p>Trend Prod 5 Pure</p></div>
  </div>
</body>
</html>
